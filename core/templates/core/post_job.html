{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<style>
    .post-container {
        max-width: 700px;
        margin: 0 auto;
    }

    .post-card {
        background: rgba(30, 41, 59, 0.45);
        border: 1px solid var(--border-glass);
        border-radius: 20px;
        padding: 40px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .post-card h2 {
        font-weight: 700;
        margin-bottom: 25px;
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .ai-generator-box {
        background: rgba(59, 130, 246, 0.08);
        border: 1px solid rgba(59, 130, 246, 0.2);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 30px;
    }

    .ai-generator-box h5 {
        font-size: 1rem;
        color: #e2e8f0;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* Style django form paragraphs */
    .post-card form p {
        margin-bottom: 20px;
    }

    .post-card form p label {
        display: block;
        font-size: 0.95rem;
        font-weight: 500;
        color: #cbd5e1;
        margin-bottom: 8px;
    }

    .post-card form p input, 
    .post-card form p select, 
    .post-card form p textarea {
        width: 100%;
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: white;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 0.95rem;
        transition: all 0.3s ease;
    }

    .post-card form p input:focus, 
    .post-card form p select:focus, 
    .post-card form p textarea:focus {
        background-color: rgba(255, 255, 255, 0.08);
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--primary-glow);
        outline: none;
    }

    .post-card form p textarea {
        min-height: 150px;
        resize: vertical;
    }
</style>

<div class="post-container">
    <div class="post-card">
        <h2 class="text-center">Post a New Job</h2>

        <!-- AI Description Generator Panel -->
        <div class="ai-generator-box">
            <h5><i class="fa-solid fa-wand-magic-sparkles text-primary"></i>AI Job Description Generator</h5>
            <form method="post">
                {% csrf_token %}
                <div class="input-group">
                    <input type="text" name="title" class="form-control" placeholder="Enter Job Title (e.g. 'Software Engineer')" required>
                    <button type="submit" name="generate_jd" class="btn btn-primary px-4"><i class="fa-solid fa-gears me-1"></i>Generate</button>
                </div>
            </form>
        </div>

        <!-- Job Details Submission Form -->
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 py-3 mt-3"><i class="fa-solid fa-briefcase me-2"></i>Publish Job Posting</button>
        </form>
        
        <a href="{% url 'recruiter_dashboard' %}" class="btn btn-secondary w-100 py-3 mt-3"><i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard</a>
    </div>
</div>
{% endblock %}
