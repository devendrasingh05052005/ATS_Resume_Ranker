{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<style>
    .apply-container {
        max-width: 600px;
        margin: 0 auto;
    }
    
    .apply-card {
        background: rgba(30, 41, 59, 0.45);
        border: 1px solid var(--border-glass);
        border-radius: 20px;
        padding: 40px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    
    .apply-card h2 {
        font-weight: 700;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    
    .apply-card p.job-desc-snippet {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border-glass);
    }

    /* Style django form paragraphs */
    .apply-card form p {
        margin-bottom: 25px;
    }

    .apply-card form p label {
        display: block;
        font-size: 0.95rem;
        font-weight: 500;
        color: #cbd5e1;
        margin-bottom: 8px;
    }

    .apply-card form p input[type="file"] {
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 12px;
        color: white;
        width: 100%;
        transition: all 0.3s ease;
    }

    .apply-card form p input[type="file"]::file-selector-button {
        background: var(--primary);
        border: none;
        color: white;
        padding: 6px 12px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        margin-right: 15px;
        transition: all 0.3s ease;
    }

    .apply-card form p input[type="file"]::file-selector-button:hover {
        background: var(--primary-hover);
    }
</style>

<div class="apply-container">
    <div class="apply-card">
        <div class="text-center mb-4">
            <div class="display-6 text-primary mb-2"><i class="fa-solid fa-file-arrow-up"></i></div>
            <h2>Apply: {{ job.title }}</h2>
            <p class="job-desc-snippet">Upload your resume to calculate your compatibility rating.</p>
        </div>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 py-3 mt-2"><i class="fa-solid fa-paper-plane me-2"></i>Submit Application</button>
        </form>

        <a href="{% url 'candidate_dashboard' %}" class="btn btn-secondary w-100 py-3 mt-3">
            <i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
