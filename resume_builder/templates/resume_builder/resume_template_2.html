<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ full_name }} - Resume</title>
    <style>
        :root {
            --primary: #2563eb;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --bg-sidebar: #f8fafc;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        /* Print controller banner */
        .print-banner {
            background: #0f172a;
            color: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: sans-serif;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .print-banner span {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .print-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .print-btn:hover {
            background: #2563eb;
        }

        /* Two Column Layout */
        .resume-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .main-content {
            flex: 1;
            padding: 40px 35px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Elements */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0 0 5px 0;
            letter-spacing: -0.02em;
        }

        .job-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            margin: 0 0 15px 0;
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: bold;
            color: var(--text-muted);
            border-bottom: 1.5px solid var(--border);
            padding-bottom: 4px;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }

        .content-block {
            font-size: 0.9rem;
            white-space: pre-wrap;
            color: #334155;
        }

        .contact-item {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            word-break: break-all;
        }

        .contact-item strong {
            color: var(--text-dark);
        }

        /* Print media controls */
        @media print {
            .no-print {
                display: none !important;
            }
            .resume-layout {
                min-height: auto;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Print Tool -->
    <div class="print-banner no-print">
        <span>AI-ATS Resume Suite: Print or Save as PDF</span>
        <button onclick="window.print()" class="print-btn">Print / Save as PDF</button>
    </div>

    <!-- Resume Body -->
    <div class="resume-layout">
        <!-- Left Sidebar -->
        <div class="sidebar">
            <div>
                <h1>{{ full_name }}</h1>
                <div class="job-title">{{ target_job_title }}</div>
            </div>
            
            <div>
                <div class="section-title">Contact info</div>
                <div class="contact-item"><strong>Email:</strong><br>{{ email }}</div>
                <div class="contact-item"><strong>Phone:</strong><br>{{ phone_number }}</div>
            </div>
            
            <div>
                <div class="section-title">Key Skills</div>
                <div class="content-block" style="font-size: 0.85rem;">{{ skills }}</div>
            </div>
        </div>

        <!-- Main Column -->
        <div class="main-content">
            <div>
                <div class="section-title">Work Experience</div>
                <div class="content-block">{{ work_experience }}</div>
            </div>
            
            <div>
                <div class="section-title">Education</div>
                <div class="content-block">{{ education }}</div>
            </div>
        </div>
    </div>

</body>
</html>
