<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ full_name }} - Resume</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.5;
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #ffffff;
        }

        /* Print controller banner */
        .print-banner {
            background: #0f172a;
            color: #ffffff;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .print-banner span {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .print-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .print-btn:hover {
            background: #2563eb;
        }

        /* Resume Content Styling */
        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #0f172a;
            font-weight: normal;
            letter-spacing: -0.01em;
        }

        .contact-info {
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 30px;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            font-weight: bold;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }

        .content-block {
            font-size: 0.95rem;
            white-space: pre-wrap;
            color: #334155;
        }

        /* Print media controls */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                padding: 0;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Print Tool -->
    <div class="print-banner no-print">
        <span>AI-ATS Resume Suite: Print or Save as PDF</span>
        <button onclick="window.print()" class="print-btn">Print / Save as PDF</button>
    </div>

    <!-- Resume Body -->
    <h1>{{ full_name }}</h1>
    <div class="contact-info">
        <span>Email: {{ email }}</span> | 
        <span>Phone: {{ phone_number }}</span> |
        <span>Role: {{ target_job_title }}</span>
    </div>
    
    <div class="section">
        <div class="section-title">Work Experience</div>
        <div class="content-block">{{ work_experience }}</div>
    </div>
    
    <div class="section">
        <div class="section-title">Education</div>
        <div class="content-block">{{ education }}</div>
    </div>
    
    <div class="section">
        <div class="section-title">Skills</div>
        <div class="content-block">{{ skills }}</div>
    </div>

</body>
</html>
