<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ full_name }} - Resume</title>
    <style>
        :root {
            --primary: #0284c7;
            --secondary: #0f172a;
            --text: #334155;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #ffffff;
        }

        /* Print controller banner */
        .print-banner {
            background: #0f172a;
            color: #ffffff;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            font-family: sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .print-banner span {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .print-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .print-btn:hover {
            background: #0369a1;
        }

        /* Top Creative Header */
        .header-banner {
            background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
            color: white;
            padding: 35px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .header-banner h1 {
            color: white;
            font-size: 2.4rem;
            font-weight: 800;
            margin: 0 0 5px 0;
            letter-spacing: -0.02em;
        }

        .header-banner p.role {
            font-size: 1.15rem;
            margin: 0 0 15px 0;
            font-weight: 500;
            opacity: 0.95;
        }

        .header-banner .meta-grid {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            opacity: 0.85;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 12px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--secondary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .content-block {
            font-size: 0.92rem;
            white-space: pre-wrap;
            color: #475569;
        }

        /* Print media controls */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                padding: 0;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Print Tool -->
    <div class="print-banner no-print">
        <span>AI-ATS Resume Suite: Print or Save as PDF</span>
        <button onclick="window.print()" class="print-btn">Print / Save as PDF</button>
    </div>

    <!-- Resume Body -->
    <div class="header-banner">
        <h1>{{ full_name }}</h1>
        <p class="role">{{ target_job_title }}</p>
        <div class="meta-grid">
            <span>Email: {{ email }}</span>
            <span>Phone: {{ phone_number }}</span>
        </div>
    </div>
    
    <div class="section">
        <div class="section-title">Professional Experience</div>
        <div class="content-block">{{ work_experience }}</div>
    </div>
    
    <div class="section">
        <div class="section-title">Education</div>
        <div class="content-block">{{ education }}</div>
    </div>
    
    <div class="section">
        <div class="section-title">Core Skills & Competencies</div>
        <div class="content-block">{{ skills }}</div>
    </div>

</body>
</html>
